<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BidKori{% endblock %} — Bangladesh's Live Auction Marketplace</title>
    <meta name="description" content="{% block meta_description %}BidKori — real-time online auctions for Bangladesh.{% endblock %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: {
                            50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',
                            400:'#34d399',500:'#10b981',600:'#059669',700:'#047857',
                            800:'#065f46',900:'#064e3b',950:'#022c22',
                        },
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4,0,0.6,1) infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%':{opacity:'0'},'100%':{opacity:'1'} },
                        slideUp: { '0%':{opacity:'0',transform:'translateY(20px)'},'100%':{opacity:'1',transform:'translateY(0)'} },
                    },
                },
            },
        }
    </script>
    <style>
        *, *::before, *::after { font-family: 'Inter', system-ui, sans-serif; }
        .glass { background: rgba(30,41,59,0.55); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .gradient-border { background: linear-gradient(135deg, rgba(16,185,129,0.3), rgba(59,130,246,0.15)); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 text-gray-100 min-h-screen antialiased">

    <!-- ── Navbar ───────────────────────────────────────── -->
    <nav class="sticky top-0 z-50 glass border-b border-slate-700/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <a href="/" class="flex items-center gap-2.5 group">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center shadow-lg shadow-brand-500/25 group-hover:shadow-brand-500/40 transition-shadow">
                        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                    </div>
                    <span class="text-xl font-bold bg-gradient-to-r from-brand-300 to-brand-500 bg-clip-text text-transparent">BidKori</span>
                </a>
                <!-- Nav Links -->
                <div class="flex items-center gap-4">
                    <a href="/seller/create-listing/" class="text-sm font-medium text-gray-300 hover:text-brand-400 transition-colors">
                        + New Listing
                    </a>
                    <a href="/admin/" class="text-sm font-medium text-gray-400 hover:text-gray-200 transition-colors">
                        Admin
                    </a>
                    {% if user.is_authenticated %}
                        <div class="flex items-center gap-2 ml-2 pl-4 border-l border-slate-700/60">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-brand-500 to-cyan-500 flex items-center justify-center text-xs font-bold text-white">
                                {{ user.email|first|upper }}
                            </div>
                            <span class="text-sm text-gray-300 hidden sm:inline">{{ user.email }}</span>
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- ── Main Content ─────────────────────────────────── -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- ── Toast Container ──────────────────────────────── -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-3"></div>

    <script>
        /* ── Toast Utility ──────────────────────────────── */
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const colors = {
                success: 'from-brand-600/90 to-brand-700/90 border-brand-500/50',
                error: 'from-red-600/90 to-red-700/90 border-red-500/50',
                info: 'from-blue-600/90 to-blue-700/90 border-blue-500/50',
            };
            const icons = {
                success: '✓', error: '✕', info: 'ℹ',
            };
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-3 px-5 py-3.5 rounded-xl border backdrop-blur-xl bg-gradient-to-r ${colors[type] || colors.info} text-white shadow-2xl animate-slide-up`;
            toast.innerHTML = `<span class="text-lg">${icons[type] || icons.info}</span><span class="text-sm font-medium">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.4s'; setTimeout(() => toast.remove(), 400); }, 4500);
        }

        /* ── CSRF Helper ────────────────────────────────── */
        function getCookie(name) {
            let v = null;
            if (document.cookie) {
                for (const c of document.cookie.split(';')) {
                    const t = c.trim();
                    if (t.startsWith(name + '=')) { v = decodeURIComponent(t.substring(name.length + 1)); break; }
                }
            }
            return v;
        }
        const CSRF_TOKEN = getCookie('csrftoken');
    </script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
